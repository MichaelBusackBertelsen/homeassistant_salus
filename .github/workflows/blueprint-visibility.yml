name: Conditional blueprint form
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  form:
    runs-on: ubuntu-24.04
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "homeassistant==2026.11.0" pytest pytest-asyncio
      - name: Install matching frontend
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys, homeassistant
          path = pathlib.Path(homeassistant.__file__).parent / 'components/frontend/manifest.json'
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *json.loads(path.read_text())['requirements']])
          PY
      - run: python -m pytest --noconftest -p pytest_asyncio.plugin -o asyncio_mode=auto -q tests/test_blueprint_visibility.py --tb=short
